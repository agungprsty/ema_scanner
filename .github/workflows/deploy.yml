name: Deploy EMA Scanner to Contabo VPS

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio
          pip install -r requirements.txt

      - name: Run Ruff Lint
        run: ruff check src tests

      - name: Run Pytest
        run: PYTHONPATH=. pytest tests/

  build-and-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image tag
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=${{ env.REGISTRY }}/${OWNER_LOWER}/ema-scanner:latest" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute Deployment
        run: |
          mkdir -p /var/www/ema_scanner
          cp docker-compose.prod.yml /var/www/ema_scanner/
          cd /var/www/ema_scanner

          echo "=== LOGIN GHCR ==="
          export GITHUB_REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "=== PULL DOCKER IMAGES ==="
          docker compose -f docker-compose.prod.yml pull

          echo "=== RESTART CONTAINERS ==="
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          echo "=== STATUS CONTAINER ==="
          docker compose -f docker-compose.prod.yml ps

          echo "=== CLEANUP DISK ==="
          docker image prune -f || true
